[project]
name = "spaced-repetition-agent"
version = "0.1.0"
description = "Open-source, self-hostable spaced-repetition study agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.5",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=1.0,<2",
    "langsmith>=0.14",
    "python-dateutil>=2.9",
    "alembic>=1.13",
    "google-auth[requests]>=2.38,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
capture = [
    "httpx>=0.27",
    "faster-whisper>=1.2,<2",
    # faster-whisper 1.2.1 passes an argument removed by PyAV 19.
    "av>=11,<19",
]
desktop = [
    "spaced-repetition-agent[capture]",
    "keyring>=25,<26; sys_platform == 'darwin'",
    "sounddevice; sys_platform == 'darwin'",
    "rumps; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "pyright>=1.1",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "phase2: voice-capture teaching contracts (intentionally red until implemented)",
    "phase3: authentication, isolation, desktop credential, and rate-limit TDD contracts",
    "phase4: daily MCQ quiz -- schema, agent, job, API, dashboard, integration verification",
    "whisper: opt-in real local Whisper inference",
    "desktop: requires macOS and installed desktop dependencies",
    "live_openai: explicit opt-in calls to the real OpenAI service",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` as a default arg is the framework's own
# idiom, not the bug this check exists for -- ruff's own docs recommend
# ignoring it for FastAPI codebases.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# app.py's create_app() is an intentionally-unimplemented stub (ticket
# SRA-106, tracked in PROGRESS.md) -- these imports are unused until it's
# filled in, not a real unused-import bug.
"src/sra/api/app.py" = ["F401"]
# Test arrange blocks favor one readable line per fixture row over
# wrapping; not worth reformatting existing test bodies for a line-length
# rule that mainly matters for production code.
"tests/**" = ["E501"]
# Alembic-generated revision scripts follow Alembic's own template, not
# this project's style -- don't hand-edit them to satisfy ruff.
"src/sra/alembic/versions/*.py" = ["E501", "I001", "UP035", "UP006", "UP007"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/sra/alembic/versions"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
